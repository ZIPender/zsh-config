[app]
overall = { bg = "#111014" }

[mgr]
cwd = { fg = "#d6b5f5", bold = true }

find_keyword = { fg = "#e879f9", bold = true, italic = true, underline = true }
find_position = { fg = "#bd63ff", bg = "reset", bold = true }

symlink_target = { fg = "#918799", italic = true }

marker_copied = { fg = "#75d6a5", bg = "#75d6a5" }
marker_cut = { fg = "#ff6b81", bg = "#ff6b81" }
marker_marked = { fg = "#70cfe3", bg = "#70cfe3" }
marker_selected = { fg = "#d89aff", bg = "#d89aff" }

count_copied = { fg = "#111014", bg = "#75d6a5" }
count_cut = { fg = "#111014", bg = "#ff6b81" }
count_selected = { fg = "#111014", bg = "#d89aff" }

border_symbol = "│"
border_style = { fg = "#5d4770" }


[indicator]
parent = { fg = "#918799", bg = "#1b1720" }
current = { fg = "#ffffff", bg = "#33233f", bold = true }
preview = { fg = "#bd63ff", underline = true }

padding = { open = "", close = "" }


[tabs]
active = { fg = "#111014", bg = "#bd63ff", bold = true }
inactive = { fg = "#918799", bg = "#1b1720" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }


[mode]
normal_main = { fg = "#111014", bg = "#bd63ff", bold = true }
normal_alt = { fg = "#bd63ff", bg = "#1b1720" }

select_main = { fg = "#111014", bg = "#d89aff", bold = true }
select_alt = { fg = "#d89aff", bg = "#1b1720" }

unset_main = { fg = "#111014", bg = "#ff6b81", bold = true }
unset_alt = { fg = "#ff6b81", bg = "#1b1720" }


[status]
overall = { fg = "#e7e2ea" }

perm_sep = { fg = "#69636f" }
perm_type = { fg = "#75d6a5" }
perm_read = { fg = "#e6c875" }
perm_write = { fg = "#ff6b81" }
perm_exec = { fg = "#70cfe3" }

progress_label = { fg = "#d6b5f5", bold = true }
progress_normal = { fg = "#bd63ff", bg = "#33233f" }
progress_error = { fg = "#ff6b81", bg = "#33233f" }


[which]
border = { fg = "#bd63ff" }
cand = { fg = "#d89aff" }
rest = { fg = "#918799" }
desc = { fg = "#d6b5f5" }
separator_style = { fg = "#5d4770" }


[confirm]
border = { fg = "#bd63ff" }
title = { fg = "#d89aff", bold = true }
btn_yes = { fg = "#111014", bg = "#75d6a5", bold = true }
btn_no = { fg = "#e7e2ea", bg = "#33233f" }


[spot]
border = { fg = "#bd63ff" }
title = { fg = "#d89aff", bold = true }
tbl_col = { fg = "#d6b5f5" }
tbl_cell = { fg = "#ffffff", bg = "#33233f" }


[notify]
title_info = { fg = "#70cfe3" }
title_warn = { fg = "#e6c875" }
title_error = { fg = "#ff6b81" }


[pick]
border = { fg = "#bd63ff" }
active = { fg = "#d89aff", bold = true }
inactive = { fg = "#918799" }


[input]
border = { fg = "#bd63ff" }
title = { fg = "#d89aff" }
value = { fg = "#e7e2ea" }
selected = { fg = "#ffffff", bg = "#33233f" }


[cmp]
border = { fg = "#bd63ff" }
active = { fg = "#ffffff", bg = "#33233f", bold = true }
inactive = { fg = "#918799" }


[tasks]
border = { fg = "#bd63ff" }
title = { fg = "#d89aff", bold = true }
hovered = { fg = "#ffffff", bg = "#33233f", bold = true }


[help]
border = { fg = "#bd63ff" }
chord = { fg = "#d89aff", bold = true }
action = { fg = "#e7e2ea" }
hovered = { fg = "#ffffff", bg = "#33233f", bold = true }


[filetype]
rules = [
    { mime = "image/*", fg = "#e6c875" },
    { mime = "{audio,video}/*", fg = "#d89aff" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma}", fg = "#ff6b81" },
    { url = "*", is = "exec", fg = "#75d6a5", bold = true },
    { url = "*/", fg = "#70cfe3", bold = true },
    { url = "*", fg = "#e7e2ea" },
]
